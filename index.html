<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObscuraX</title>
  <meta name="description"
    content="Blur faces in images and videos instantly. ObscuraX is a powerful online privacy tool for masking and anonymizing media with real-time preview.">
  <meta name="keywords" content="face blur tool, video blur, image masking, privacy tool, anonymize video">
  <script>
    // Apply the saved colour mode before first paint (see src/hooks/useTheme.ts).
    try {
      var t = localStorage.getItem("obscurax.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
